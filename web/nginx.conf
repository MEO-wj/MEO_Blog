server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ^~ /game-assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        types { application/wasm wasm; application/javascript js; text/html html; text/plain txt md; audio/mpeg mp3; font/woff woff; application/octet-stream data qst; application/gzip gz; }
        try_files $uri =404;
    }
    gzip on;
    gzip_types application/javascript text/css application/wasm application/octet-stream;
}
