version: "3.9"

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - SERVER_ADDR=:8080
      - DATABASE_URL=postgres://meo:${POSTGRES_PASSWORD}@postgres:5432/meo_blog?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SEQUENCE=${ADMIN_SEQUENCE}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - E:/MEO_Blog_Data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=meo_blog
      - POSTGRES_USER=meo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - E:/MEO_Blog_Data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meo -d meo_blog"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - E:/MEO_Blog_Data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://meo:${POSTGRES_PASSWORD}@postgres:5432/meo_blog?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
