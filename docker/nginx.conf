# HTTP → HTTPS redirect for both domains
server {
    listen 80;
    server_name meowj.top www.meowj.top;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container-local health check; public traffic still redirects to HTTPS.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://meowj.top$request_uri;
    }
}

# www → bare domain redirect (HTTPS)
server {
    listen 443 ssl;
    server_name www.meowj.top;

    ssl_certificate     /etc/letsencrypt/live/meowj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meowj.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://meowj.top$request_uri;
}

# Main site — meowj.top
server {
    listen 443 ssl;
    server_name meowj.top;

    ssl_certificate     /etc/letsencrypt/live/meowj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meowj.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # index.html — never cache (entry point references fingerprinted assets)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        gzip_static on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Uploads — serve directly from disk (skip backend proxy for speed)
    location /uploads/ {
        alias /app/uploads/;
        add_header Cache-Control "public, max-age=604800";
        gzip_static on;
        try_files $uri =404;
    }

    location = /Sence_layout.json {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
        gzip_static on;
        try_files $uri =404;
    }

    # Model files with strong cache
    location /model/ {
        alias /usr/share/models/;
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        gzip off;
        gzip_static off;
        sendfile off;
        try_files $uri =404;
    }

    # Static assets with immutable cache (fingerprinted filenames)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    location /sound/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff2;
}
