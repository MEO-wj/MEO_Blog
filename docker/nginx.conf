# HTTP → HTTPS redirect for both domains
server {
    listen 80;
    server_name meowj.top www.meowj.top;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://meowj.top$request_uri;
    }
}

# www → bare domain redirect (HTTPS)
server {
    listen 443 ssl;
    server_name www.meowj.top;

    ssl_certificate     /etc/letsencrypt/live/meowj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meowj.top/privkey.pem;

    return 301 https://meowj.top$request_uri;
}

# Main site — meowj.top
server {
    listen 443 ssl;
    server_name meowj.top;

    ssl_certificate     /etc/letsencrypt/live/meowj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meowj.top/privkey.pem;

    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads reverse proxy
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
    }

    # Model files with strong cache
    location /model/ {
        alias /usr/share/models/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # Static assets with immutable cache (fingerprinted filenames)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff2;
}
