version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web-dist:/usr/share/nginx/html:ro
      - ./model:/usr/share/models:ro
    depends_on:
      - web
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    volumes:
      - web-dist:/app/dist

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - SERVER_ADDR=:8080
      - DATABASE_URL=postgres://meo:${POSTGRES_PASSWORD}@postgres:5432/meo_blog?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis
      - migrate

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=meo_blog
      - POSTGRES_USER=meo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://meo:${POSTGRES_PASSWORD}@postgres:5432/meo_blog?sslmode=disable", "up"]
    depends_on:
      - postgres

volumes:
  pg-data:
  redis-data:
  web-dist:
